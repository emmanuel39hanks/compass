[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
test = "contracts/test"
script = "contracts/script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
# 1Shot permissionless relayer + MetaMask DelegationManager are live on these.
# Base / Linea are cheapest for the mainnet relay requirement.
mainnet = "https://eth.llamarpc.com"
base = "https://mainnet.base.org"
linea = "https://rpc.linea.build"
base_sepolia = "https://sepolia.base.org"

# See https://book.getfoundry.sh for config reference
