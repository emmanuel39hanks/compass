name: release

# Publish all @compass_agents/* packages on a v* tag. Requires the NPM_TOKEN secret.
# Packages publish in dependency (topological) order so workspace:* deps resolve.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test && bun run typecheck && bun run lint
      - name: Publish (topological order)
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for pkg in core brain-venice delegation relayer-1shot x402 plugin-a2a gateway plugin-telegram cli; do
            echo "publishing @compass_agents/$pkg"
            (cd packages/$pkg && bun publish --access public --tag latest) || echo "skip $pkg (already published?)"
          done
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
